name: Build

# Gera os instaladores de Linux (.deb e .AppImage) e Windows (.exe NSIS) em
# cada push e PR para a main, e deixa os arquivos como artefatos da execução.
# Ao empurrar uma tag v* (ex.: v0.1.0), publica também uma release com eles.
#
# O CI nunca recebe a chave do Movidesk: os testes que chamam a API real são
# `#[ignore]` e só rodam na máquina de quem tem o .env.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
          - platform: windows-latest
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Bun
        uses: oven-sh/setup-bun@v2

      # O Vite roda no Node (o binário dele tem shebang de node).
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # Typecheck + build do frontend. Precisa vir antes dos testes: o
      # `generate_context!` do Tauri exige a pasta dist/ para compilar.
      - name: Frontend
        run: bun run build

      - name: Testes do Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Sem tag, o tauri-action só compila; com tag, cria a release e anexa os
      # instaladores.
      - name: Build (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Movidesk Extrator ${{ github.ref_name }}"
          releaseBody: "Extrai todos os tickets de um cliente do Movidesk com o histórico completo de conversa. Linux: .deb ou .AppImage. Windows: instalador .exe."
          releaseDraft: false
          prerelease: false

      # O linuxdeploy (usado pelo bundler do Tauri) empacota a
      # libwayland-client do runner (Ubuntu 22.04) dentro do AppImage. Em
      # distros com Mesa mais nova (rolling release), essa versão quebra o EGL
      # do WebKit e a janela abre em branco (tauri-apps/tauri#15665). Remover a
      # lib do pacote força o uso da libwayland-client do sistema.
      - name: Corrigir AppImage (remover libwayland-client empacotada)
        if: runner.os == 'Linux'
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name "*.AppImage")
          echo "Corrigindo $APPIMAGE"
          "$APPIMAGE" --appimage-extract > /dev/null
          rm -f squashfs-root/usr/lib/libwayland-client.so*
          curl -sL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          rm -f "$APPIMAGE"
          ./appimagetool --appimage-extract-and-run --no-appstream squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool

      - name: Reenviar AppImage corrigido para a release
        if: runner.os == 'Linux' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name "*.AppImage")
          gh release upload "${{ github.ref_name }}" "$APPIMAGE" --clobber

      - name: Guardar instaladores (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: movidesk-extrator-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Guardar instalador (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: movidesk-extrator-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
