[package]
name = "movidesk-extrator"
version = "0.1.0"
description = "Extrai todos os tickets de um cliente do Movidesk, com o histórico completo de conversa"
authors = ["Diogo Graciano Comin"]
edition = "2021"

[lib]
name = "movidesk_extrator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time", "sync", "fs", "macros", "rt-multi-thread"] }
tokio-util = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
dotenvy = "0.15"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
